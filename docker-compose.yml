services:
  baduk:
    build: .
    restart: unless-stopped
    ports:
      - "3100:3100"
    env_file:
      - .env
    volumes:
      - baduk-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  baduk-data: